llm:
  model: "Qwen/Qwen3.5-9B"
  base_url: "https://api.siliconflow.cn/v1"
  temperature: 0.0
  max_tokens: 256

judge:
  model: "Qwen/Qwen3.5-9B"
  base_url: "https://api.siliconflow.cn/v1"
  temperature: 0.0
  max_tokens: 16
  enable_implicit_failures: true

extractor:
  model: "deepseek-ai/DeepSeek-V3.2"
  base_url: "https://api.siliconflow.cn/v1"
  temperature: 0.0
  max_tokens: 512

agent:
  max_steps: 100
  max_memory_inject: 3
  enable_memory: true

memory:
  embedding_model: "all-MiniLM-L6-v2"
  max_entries: 500
  retrieval_top_k: 3
  persist_dir: "./memory_store"

alfworld:
  split: "eval_out_of_distribution"

experiment:
  seed: 42
  num_epochs: 1
  results_dir: "./results"
  log_level: "INFO"

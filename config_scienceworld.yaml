llm:
  model: "deepseek-ai/DeepSeek-V3.2"
  base_url: "https://api.siliconflow.cn/v1"
  temperature: 0.0
  max_tokens: 256

judge:
  model: "deepseek-ai/DeepSeek-V3.2"
  base_url: "https://api.siliconflow.cn/v1"
  temperature: 0.0
  max_tokens: 512
  enable_implicit_failures: true
  enable_rule_repair_advice: true
  implicit_failure_confidence_threshold: 0.8
  repair_confidence_threshold: 0.7

extractor:
  model: "deepseek-ai/DeepSeek-V3.2"
  base_url: "https://api.siliconflow.cn/v1"
  temperature: 0.0
  max_tokens: 512

agent:
  max_steps: 100
  max_memory_inject: 1
  prompt_history_window: 10
  enable_memory: true

memory:
  embedding_model: "all-MiniLM-L6-v2"
  max_entries: 500
  retrieval_top_k: 1
  retrieval_candidate_k: 5
  min_score: 0.0
  enable_failure_type_filter: true
  enable_safety_gate: true
  relevance_score_threshold: 0.45
  enable_relevance_judge: false
  persist_dir: "./memory_store"

experiment:
  seed: 42
  num_epochs: 1
  results_dir: "./results"
  log_level: "INFO"
